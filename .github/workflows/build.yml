name: Create and publish a Docker image

on:
    push:
        tags:
            - "*"

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-and-push-image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            attestations: write
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for server's Docker image
              id: meta-server
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server

            - name: Build and push server's Docker image
              id: push-server
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta-server.outputs.tags }}
                  labels: ${{ steps.meta-server.outputs.labels }}

            - name: Extract metadata (tags, labels) for liquidsoap's Docker image
              id: meta-liquidsoap
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Build and push liquidsoap's Docker image
              id: push-liquidsoap
              uses: docker/build-push-action@v7
              with:
                  context: liquidsoap
                  file: liquidsoap/Dockerfile
                  push: true
                  tags: ${{ steps.meta-liquidsoap.outputs.tags }}
                  labels: ${{ steps.meta-liquidsoap.outputs.labels }}
