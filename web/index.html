<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			/* https://www.joshwcomeau.com/css/custom-css-reset/ */
			/* 1. Use a more-intuitive box-sizing model */
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			/* 2. Remove default margin */
			*:not(dialog) {
				margin: 0;
			}

			/* 3. Enable keyword animations */
			@media (prefers-reduced-motion: no-preference) {
				html {
					interpolate-size: allow-keywords;
				}
			}

			body {
				/* 4. Increase line-height */
				line-height: 1.5;
				/* 5. Improve text rendering */
				-webkit-font-smoothing: antialiased;
			}

			/* 6. Improve media defaults */
			img,
			picture,
			video,
			canvas,
			svg {
				display: block;
				max-width: 100%;
			}

			/* 7. Inherit fonts for form controls */
			input,
			button,
			textarea,
			select {
				font: inherit;
			}

			/* 8. Avoid text overflows */
			p,
			h1,
			h2,
			h3,
			h4,
			h5,
			h6 {
				overflow-wrap: break-word;
			}

			/* 9. Improve line wrapping */
			p {
				text-wrap: pretty;
			}
			h1,
			h2,
			h3,
			h4,
			h5,
			h6 {
				text-wrap: balance;
			}

			/*
			10. Create a root stacking context
			*/
			#root,
			#__next {
				isolation: isolate;
			}

			#player {
				z-index: 1;
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
			}

			#cover {
				position: fixed;
				top: 0%;
				right: 0%;
				width: calc(248px);
				height: calc(248px);
			}
		</style>
	</head>
	<body>
		<div id="background"></div>

		<main>
			<audio
				id="player"
				controls
				src="http://localhost:8000/stream.mp3"
			></audio>
			<pre id="metadata"></pre>
			<img id="cover" />
		</main>

		<script type="module">
			const metadataEl = document.querySelector("#metadata");
			const statusEl = document.querySelector("#status");
			const coverEl = document.querySelector("#cover");

			const eventSource = new EventSource("/metadata");

			eventSource.addEventListener("open", (event) => {
				console.log("Connected");
			});

			eventSource.addEventListener("message", (event) => {
				const { cover, ...data } = JSON.parse(event.data);

				metadataEl.textContent = JSON.stringify(data, null, 2);
				coverEl.src = cover;
			});

			eventSource.addEventListener("error", (event) => {
				console.error("Connection failed:", event);
			});
		</script>
	</body>
</html>
