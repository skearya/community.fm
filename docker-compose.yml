services:
    server:
        build:
            context: .
            dockerfile: packages/server/Dockerfile
        container_name: server
        restart: unless-stopped
        stop_grace_period: 1s
        ports:
            - 8080:8080
        environment:
            - DISCORD_BOT_TOKEN
            - DISCORD_TEST_GUILD
            - STREAM_BASE_URL
            - YOUTUBE_PLAYLIST_ID
        volumes:
            - ./web:/static:ro
            - ${DATA_DIRECTORY}:/data:rw
            - ${DOWNLOAD_DIRECTORY}:/downloads:rw
            - ${LOCAL_MUSIC_DIRECTORY}:/music:ro
            - ${STREAMRIP_CONFIG_PATH}:/home/nonroot/.config/streamrip/config.toml:ro
    icecast:
        image: ghcr.io/libretime/icecast:2.4.4
        container_name: icecast
        restart: unless-stopped
        ports:
            - 8000:8000
        environment:
            - ICECAST_SOURCE_PASSWORD
            - ICECAST_RELAY_PASSWORD
            - ICECAST_ADMIN_PASSWORD
            - ICECAST_ADMIN_USERNAME
            - ICECAST_ADMIN_EMAIL
            - ICECAST_LOCATION
            - ICECAST_HOSTNAME
            - ICECAST_MAX_CLIENTS
            - ICECAST_MAX_SOURCES
        depends_on:
            - server
    liquidsoap:
        image: savonet/liquidsoap:v2.4.4
        container_name: liquidsoap
        entrypoint: ["liquidsoap", "/etc/liquidsoap/script.liq"]
        restart: unless-stopped
        ports:
            - 8001-8002:8001-8002
        environment:
            - ICECAST_SOURCE_PASSWORD
            - LIVE_SOURCE_USERNAME
            - LIVE_SOURCE_PASSWORD
        volumes:
            - ./liquidsoap:/etc/liquidsoap:ro
            - ${DOWNLOAD_DIRECTORY}:/downloads:rw
            - ${LOCAL_MUSIC_DIRECTORY}:/music:ro
        depends_on:
            - icecast
